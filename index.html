<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Envía tu mensaje especial 💌</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container animate-fade">
    <h1>💌 Envía un mensaje especial</h1>
    <p>Escribe algo bonito para esa persona especial.</p>
    <form id="mensajeForm">
      <input type="text" name="nombre" placeholder="Tu nombre" required>
      <input type="text" name="destino" placeholder="Nombre de quien recibe" required>
      <textarea name="mensaje" placeholder="Escribe tu mensaje..." required></textarea>
      <button type="submit">✨ Generar enlace ✨</button>
    </form>
    <div id="enlace"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
