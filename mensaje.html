<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tu mensaje especial 💖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Pantalla del regalo decorativo -->
  <div class="regalo-screen">
    <div class="caja-regalo">🎁</div>
    <button id="abrir-regalo">Abrir regalo</button>
  </div>

  <!-- Pantalla del mensaje (oculta inicialmente) -->
  <div id="mensaje-screen" class="mensaje-container animate-slide" style="display:none;">
    <h2 id="saludo">Hola!</h2>
    <p id="contenido"></p>
    <div class="emoji">💌✨🌸</div>
  </div>

  <canvas id="confeti"></canvas>
  <script src="script.js"></script>
</body>
</html>
