<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tu mensaje especial 💖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Pantalla del regalo -->
  <div id="regalo-screen" class="regalo-screen">
    <div class="caja-regalo" id="caja-regalo">🎁</div>
  </div>

  <!-- Pantalla del mensaje (inicialmente oculta) -->
  <div id="mensaje-screen" class="mensaje-container animate-slide" style="display:none;">
    <h2 id="saludo">Hola!</h2>
    <p id="contenido"></p>
    <div class="emoji">💌✨🌸</div>
  </div>

  <!-- Confeti y corazones -->
  <canvas id="confeti"></canvas>

  <script src="script.js"></script>
</body>
</html>
